openapi: 3.0.3
info:
  title: TYRAG document feed integration
  version: 3.2.0
  description: >-
    Document Feed 3.2 adds INLINE_JSON to the existing v3 FILE_SHARE endpoint.
    HTTP 202 is an acceptance receipt only. Terminal processing results use the
    existing file-share-callback-v1.yaml contract.
servers:
  - url: /
tags:
  - name: documents-v3
paths:
  /enterprise/api/v3/documents:
    post:
      tags: [documents-v3]
      summary: Register a FILE_SHARE PDF or an inline JSON document
      operationId: v3RegisterDocument
      security:
        - HmacSignature: []
      parameters:
        - $ref: '#/components/parameters/TimestampHeader'
        - $ref: '#/components/parameters/KeyIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentUpsertRequest'
      responses:
        '202':
          description: First acceptance or idempotent replay
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentAccepted' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /enterprise/api/v3/documents/sync-status:
    get:
      tags: [documents-v3]
      summary: List document feed statuses in an authorized binding
      operationId: v3ListDocumentStatus
      security:
        - HmacSignature: []
      parameters:
        - $ref: '#/components/parameters/TimestampHeader'
        - $ref: '#/components/parameters/KeyIdHeader'
        - $ref: '#/components/parameters/TenantIdQuery'
        - $ref: '#/components/parameters/SourceSystemQuery'
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Most recently updated document feed versions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentStatusPage' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /enterprise/api/v3/documents/{externalDocumentId}/status:
    get:
      tags: [documents-v3]
      summary: Read one document feed version status
      operationId: v3GetDocumentStatus
      security:
        - HmacSignature: []
      parameters:
        - $ref: '#/components/parameters/TimestampHeader'
        - $ref: '#/components/parameters/KeyIdHeader'
        - name: externalDocumentId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
        - $ref: '#/components/parameters/TenantIdQuery'
        - $ref: '#/components/parameters/SourceSystemQuery'
        - name: sourceVersionId
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 64 }
      responses:
        '200':
          description: Current processing and retrieval-readiness facts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentStatus' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    HmacSignature:
      type: apiKey
      in: header
      name: X-TY-Signature
      description: >-
        Existing v1 request HMAC. Verification also requires X-TY-Timestamp,
        X-TY-Key-Id, and an allowed tenant/source binding.
  parameters:
    TimestampHeader:
      name: X-TY-Timestamp
      in: header
      required: true
      schema: { type: string, pattern: '^\d{10}$' }
    KeyIdHeader:
      name: X-TY-Key-Id
      in: header
      required: true
      schema: { type: string, minLength: 1 }
    TenantIdQuery:
      name: tenantId
      in: query
      required: true
      schema: { type: string, minLength: 1, maxLength: 64 }
    SourceSystemQuery:
      name: sourceSystem
      in: query
      required: true
      schema: { type: string, minLength: 1, maxLength: 64 }
  responses:
    Error:
      description: Stable external error envelope
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    FileShareSource:
      type: object
      additionalProperties: false
      required: [kind, storageRootId, relativePath]
      properties:
        kind: { type: string, enum: [FILE_SHARE] }
        storageRootId: { type: string, minLength: 1, maxLength: 64 }
        relativePath: { type: string, minLength: 1, maxLength: 1024 }
        size: { type: integer, minimum: 0, nullable: true }
        etag: { type: string, maxLength: 256, nullable: true }
    InlineJsonSource:
      type: object
      additionalProperties: false
      required: [kind, content]
      properties:
        kind: { type: string, enum: [INLINE_JSON] }
        content:
          type: object
          additionalProperties: true
          description: >-
            Arbitrary JSON object. Ordinary unknown fields are indexed as
            document content and are not promoted to metadata filters.
    FileShareDocumentUpsertRequest:
      type: object
      additionalProperties: false
      required:
        - eventId
        - eventType
        - tenantId
        - sourceSystem
        - externalDocumentId
        - sourceVersionId
        - sha256
        - fileName
        - mediaType
        - source
        - metadata
      properties:
        eventId: { type: string, minLength: 1, maxLength: 128 }
        eventType: { type: string, enum: [upsert, reindex] }
        tenantId: { type: string, minLength: 1, maxLength: 64 }
        sourceSystem: { type: string, minLength: 1, maxLength: 64 }
        externalDocumentId: { type: string, minLength: 1, maxLength: 128 }
        sourceVersionId: { type: string, minLength: 1, maxLength: 64 }
        sha256: { type: string, pattern: '^[0-9a-fA-F]{64}$' }
        fileName: { type: string, minLength: 1, maxLength: 255 }
        mediaType: { type: string, enum: [application/pdf] }
        source: { $ref: '#/components/schemas/FileShareSource' }
        metadata:
          $ref: './file-share-v3.yaml#/components/schemas/DocumentMetadata'
        batchId: { type: string, maxLength: 128, nullable: true }
    InlineJsonDocumentUpsertRequest:
      type: object
      additionalProperties: false
      description: >-
        sha256 is intentionally absent. The Gateway computes the content hash
        from stable JSON bytes. fileName must end in .json. Request bodies are
        limited to 2 MiB and source.content nesting is limited to 20 levels.
      required:
        - eventId
        - eventType
        - tenantId
        - sourceSystem
        - externalDocumentId
        - sourceVersionId
        - fileName
        - mediaType
        - source
        - metadata
      properties:
        eventId: { type: string, minLength: 1, maxLength: 128 }
        eventType: { type: string, enum: [upsert, reindex] }
        tenantId: { type: string, minLength: 1, maxLength: 64 }
        sourceSystem: { type: string, minLength: 1, maxLength: 64 }
        externalDocumentId: { type: string, minLength: 1, maxLength: 128 }
        sourceVersionId: { type: string, minLength: 1, maxLength: 64 }
        fileName:
          type: string
          minLength: 6
          maxLength: 255
          pattern: '\.[jJ][sS][oO][nN]$'
        mediaType: { type: string, enum: [application/json] }
        source: { $ref: '#/components/schemas/InlineJsonSource' }
        metadata:
          $ref: './file-share-v3.yaml#/components/schemas/DocumentMetadata'
        batchId: { type: string, maxLength: 128, nullable: true }
    DocumentUpsertRequest:
      oneOf:
        - $ref: '#/components/schemas/FileShareDocumentUpsertRequest'
        - $ref: '#/components/schemas/InlineJsonDocumentUpsertRequest'
    DocumentReadiness:
      type: object
      additionalProperties: false
      required:
        - currentVersion
        - active
        - syncReady
        - parserReadback
        - ragflowIdsPresent
        - qualityPassed
        - blockingReason
      properties:
        currentVersion: { type: boolean }
        active: { type: boolean }
        syncReady: { type: boolean }
        parserReadback: { type: boolean }
        ragflowIdsPresent: { type: boolean }
        qualityPassed: { type: boolean }
        blockingReason: { type: string, nullable: true }
    StatusError:
      type: object
      additionalProperties: false
      required: [code, message, retryable]
      properties:
        code: { type: string }
        message: { type: string }
        retryable: { type: boolean }
    DocumentAccepted:
      type: object
      additionalProperties: false
      required:
        - operationId
        - externalDocumentId
        - sourceVersionId
        - deduplicated
        - updatedAt
      properties:
        operationId: { type: string }
        externalDocumentId: { type: string }
        sourceVersionId: { type: string }
        deduplicated: { type: boolean }
        updatedAt: { type: string, format: date-time }
    DocumentStatus:
      type: object
      additionalProperties: false
      required:
        - operationId
        - externalDocumentId
        - sourceVersionId
        - statusUrl
        - sourceKind
        - status
        - stage
        - pipelineStatus
        - parseCompleted
        - indexCompleted
        - ingestState
        - sourceState
        - deduplicated
        - businessStatus
        - currentVersion
        - eventStatus
        - updatedAt
        - retrievable
        - readiness
        - qualityStatus
        - errorCode
        - error
      properties:
        operationId: { type: string }
        externalDocumentId: { type: string }
        sourceVersionId: { type: string }
        statusUrl: { type: string, pattern: '^/enterprise/api/v3/documents/.+/status\?' }
        sourceKind: { type: string, enum: [FILE_SHARE, INLINE_JSON] }
        status: { type: string }
        stage: { type: string, nullable: true }
        pipelineStatus: { type: string, nullable: true }
        parseCompleted: { type: boolean }
        indexCompleted: { type: boolean }
        ingestState: { type: string }
        sourceState: { type: string }
        deduplicated: { type: boolean }
        businessStatus: { type: string }
        currentVersion: { type: boolean }
        eventStatus: { type: string }
        updatedAt: { type: string, format: date-time }
        retrievable: { type: boolean }
        readiness: { $ref: '#/components/schemas/DocumentReadiness' }
        qualityStatus: { type: string, nullable: true }
        errorCode: { type: string, nullable: true }
        error:
          allOf:
            - $ref: '#/components/schemas/StatusError'
          nullable: true
    DocumentStatusPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/DocumentStatus' }
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message, requestId, retryable]
      properties:
        code: { type: string }
        message: { type: string }
        requestId: { type: string }
        retryable: { type: boolean }
