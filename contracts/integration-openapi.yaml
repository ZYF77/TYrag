openapi: 3.1.0
info:
  title: Enterprise RAGFlow Integration API
  version: 1.0.0
servers:
  - url: /enterprise/api/v1
paths:
  /auth/me:
    get:
      summary: Return authenticated end-user principal
      operationId: getAuthMe
      x-status: implemented
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current user principal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPrincipal'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /documents:
    post:
      summary: Upsert an external business document version
      operationId: upsertDocument
      x-status: implemented
      security:
        - ServiceAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentUpsertRequest'
      responses:
        '202':
          description: Accepted or deduplicated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentSyncResponse'
        '422': { $ref: '#/components/responses/Error' }
  /documents/sync-status:
    get:
      summary: List synchronization status for documents
      operationId: listSyncStatus
      x-status: implemented
      security:
        - ServiceAuth: []
      parameters:
        - name: tenant_id
          in: query
          required: false
          schema: { type: string }
        - name: source_system
          in: query
          required: false
          schema: { type: string }
        - name: status
          in: query
          required: false
          schema: { type: string }
        - name: batch_id
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 100, maximum: 500 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: Synchronization status items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FileSyncItem'
  /documents/{externalDocumentId}/disable:
    post:
      summary: Disable all active knowledge versions for an external document
      operationId: disableDocument
      x-status: implemented
      security:
        - ServiceAuth: []
      parameters:
        - $ref: '#/components/parameters/ExternalDocumentId'
        - name: tenant_id
          in: query
          required: false
          schema: { type: string }
        - name: source_system
          in: query
          required: true
          schema: { type: string }
      responses:
        '202': { description: Accepted }
        '404': { $ref: '#/components/responses/Error' }
  /documents/{externalDocumentId}/restore:
    post:
      summary: Restore a logically disabled/deleted external document
      operationId: restoreDocument
      x-status: implemented
      security:
        - ServiceAuth: []
      parameters:
        - $ref: '#/components/parameters/ExternalDocumentId'
        - name: tenant_id
          in: query
          required: false
          schema: { type: string }
        - name: source_system
          in: query
          required: true
          schema: { type: string }
      responses:
        '202':
          description: Restore accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentSyncResponse'
        '404': { $ref: '#/components/responses/Error' }
  /documents/{externalDocumentId}:
    delete:
      summary: Logically delete an external document
      operationId: deleteDocument
      x-status: implemented
      security:
        - ServiceAuth: []
      parameters:
        - $ref: '#/components/parameters/ExternalDocumentId'
        - name: tenant_id
          in: query
          required: false
          schema: { type: string }
        - name: source_system
          in: query
          required: true
          schema: { type: string }
      responses:
        '202':
          description: Logical delete accepted
        '404': { $ref: '#/components/responses/Error' }
  /documents/{externalDocumentId}/status:
    get:
      summary: Get synchronization and RAGFlow processing status
      operationId: getDocumentStatus
      x-status: implemented
      security:
        - ServiceAuth: []
      parameters:
        - $ref: '#/components/parameters/ExternalDocumentId'
        - name: tenant_id
          in: query
          required: false
          schema: { type: string }
          description: Tenant identifier used when looking up the document mapping
        - name: refresh
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: When true, refresh status from RAGFlow before returning
      responses:
        '200':
          description: Current status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentSyncResponse'
        '404': { $ref: '#/components/responses/Error' }
  /documents/quality-status:
    get:
      summary: List parse quality evaluation status for documents
      operationId: listQualityStatus
      x-status: implemented
      security:
        - ServiceAuth: []
      parameters:
        - name: tenant_id
          in: query
          required: false
          schema: { type: string }
        - name: source_system
          in: query
          required: false
          schema: { type: string }
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [passed, review_required, failed]
        - name: parser_profile
          in: query
          required: false
          schema: { type: string }
        - name: batch_id
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 100, maximum: 500 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: Quality evaluation status items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocumentQualityResponse'
        '401': { $ref: '#/components/responses/Error' }
  /documents/{externalDocumentId}/quality:
    get:
      summary: Get parse quality status for an authorized document
      operationId: getDocumentQuality
      x-status: implemented
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ExternalDocumentId'
        - name: source_system
          in: query
          required: false
          schema: { type: string, default: DEMO }
        - name: source_version_id
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Quality evaluation status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentQualityResponse'
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /documents/{externalDocumentId}/quality:reevaluate:
    post:
      summary: Request a new quality evaluation for a document version
      operationId: reevaluateDocumentQuality
      x-status: implemented
      security:
        - ServiceAuth: []
      parameters:
        - $ref: '#/components/parameters/ExternalDocumentId'
        - name: tenant_id
          in: query
          required: true
          schema: { type: string }
        - name: source_system
          in: query
          required: true
          schema: { type: string }
        - name: source_version_id
          in: query
          required: true
          schema: { type: string }
      responses:
        '202':
          description: New evaluation accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReevaluateQualityResponse'
        '404': { $ref: '#/components/responses/Error' }
  /conversations:
    post:
      summary: "Planned: Create a business conversation mapped to RAGFlow"
      operationId: createConversation
      x-status: planned
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConversationRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '501': { description: Not implemented }
  /conversations/{conversationId}/messages:stream:
    post:
      summary: "Planned: Ask a question and stream evidence-grounded answer"
      operationId: streamAsk
      x-status: planned
      security:
        - BearerAuth: []
      parameters:
        - name: conversationId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AskRequest'
      responses:
        '200':
          description: text/event-stream
          content:
            text/event-stream:
              schema: { type: string }
        '501': { description: Not implemented }
  /citations/{citationId}:
    get:
      summary: "Planned: Resolve an authorized citation"
      operationId: getCitation
      x-status: planned
      security:
        - BearerAuth: []
      parameters:
        - name: citationId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Citation details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Citation'
        '403': { $ref: '#/components/responses/Error' }
        '501': { description: Not implemented }
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ServiceAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  parameters:
    ExternalDocumentId:
      name: externalDocumentId
      in: path
      required: true
      schema: { type: string, maxLength: 128 }
  responses:
    Error:
      description: Stable safe error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    DocumentUpsertRequest:
      type: object
      required: [eventId, sourceSystem, externalDocumentId, sourceVersionId, sha256, fileName, source, metadata]
      properties:
        eventId: { type: string }
        eventType: { type: string, enum: [upsert, reindex], default: upsert }
        sourceSystem: { type: string }
        externalDocumentId: { type: string }
        sourceVersionId: { type: string }
        sha256: { type: string, pattern: '^[0-9a-fA-F]{64}$' }
        fileName: { type: string, maxLength: 255 }
        mediaType: { type: string, default: application/pdf }
        source:
          type: object
          required: [bucket, objectKey]
          properties:
            bucket: { type: string }
            objectKey: { type: string }
        metadata:
          type: object
          description: Must validate against contracts/metadata-schema.json
        batchId: { type: [string, 'null'], maxLength: 128 }
    DocumentSyncResponse:
      type: object
      required: [externalDocumentId, sourceVersionId, status, deduplicated]
      properties:
        externalDocumentId: { type: string }
        sourceVersionId: { type: string }
        ragflowDatasetId: { type: [string, 'null'] }
        ragflowDocumentId: { type: [string, 'null'] }
        status: { type: string }
        stage: { type: [string, 'null'] }
        deduplicated: { type: boolean }
        error: { anyOf: [{ $ref: '#/components/schemas/ErrorResponse' }, { type: 'null' }] }
        businessStatus: { type: string }
        currentVersion: { type: boolean }
        eventStatus: { type: string }
        updatedAt: { type: string, format: date-time }
    FileSyncItem:
      type: object
      required: [externalDocumentId, fileName, status, updatedAt]
      properties:
        externalDocumentId: { type: string }
        sourceVersionId: { type: [string, 'null'] }
        fileName: { type: string }
        status: { type: string }
        stage: { type: [string, 'null'] }
        error: { anyOf: [{ $ref: '#/components/schemas/ErrorResponse' }, { type: 'null' }] }
        updatedAt: { type: string, format: date-time }
        businessStatus: { type: string }
        currentVersion: { type: boolean }
        batchId: { type: [string, 'null'] }
    DocumentQualityResponse:
      type: object
      required: [externalDocumentId, sourceVersionId, evaluationState]
      properties:
        externalDocumentId: { type: string }
        sourceVersionId: { type: string }
        evaluationState:
          type: string
          enum: [pending, running, completed, failed, not_started]
        evaluationVersion: { type: [string, 'null'] }
        parseQualityStatus:
          type: [string, 'null']
          enum: [passed, review_required, failed]
        qualityReasons:
          type: array
          items: { type: string }
        parserProfile: { type: [string, 'null'] }
        policyVersion: { type: [string, 'null'] }
        completedAt: { type: [string, 'null'], format: date-time }
        metricSummary:
          type: object
          additionalProperties: true
        qualityDimensions:
          type: object
          additionalProperties:
            type: string
            enum: [passed, review_required, failed, not_applicable, not_evaluated]
    ReevaluateQualityResponse:
      type: object
      required: [externalDocumentId, sourceVersionId, evaluationId, evaluationVersion, requestId]
      properties:
        externalDocumentId: { type: string }
        sourceVersionId: { type: string }
        evaluationId: { type: integer }
        evaluationVersion: { type: string }
        requestId: { type: string }
    CreateConversationRequest:
      type: object
      properties:
        equipmentId: { type: [string, 'null'] }
        fixedAssetNo: { type: [string, 'null'] }
        faultCode: { type: [string, 'null'] }
    Conversation:
      type: object
      required: [conversationId, createdAt]
      properties:
        conversationId: { type: string }
        ragflowSessionId: { type: string }
        createdAt: { type: string, format: date-time }
    AskRequest:
      type: object
      required: [question]
      properties:
        question: { type: string, minLength: 1, maxLength: 8000 }
        equipmentId: { type: [string, 'null'] }
        faultCode: { type: [string, 'null'] }
    Citation:
      type: object
      required: [citationId, sourceType, title]
      properties:
        citationId: { type: string }
        sourceType: { enum: [document, business_record] }
        title: { type: string }
        documentId: { type: [string, 'null'] }
        versionId: { type: [string, 'null'] }
        pageNo: { type: [integer, 'null'] }
        bbox: { type: [object, 'null'] }
        assetId: { type: [string, 'null'] }
        excerpt: { type: [string, 'null'] }
        recordType: { type: [string, 'null'] }
        recordId: { type: [string, 'null'] }
    ErrorResponse:
      type: object
      required: [code, message, requestId]
      properties:
        code: { type: string }
        message: { type: string }
        requestId: { type: string }
        retryable: { type: boolean }
        details: { type: object, additionalProperties: true }
    UserPrincipal:
      type: object
      required: [businessUserId, tenantId, mappingStatus]
      properties:
        businessUserId:
          type: string
          description: Business user identifier
        displayName:
          type: string
          description: Human-readable display name
        tenantId:
          type: string
          description: Enterprise tenant identifier
        departmentIds:
          type: array
          items:
            type: string
          description: Department memberships
        roles:
          type: array
          items:
            type: string
          description: Role codes
        capabilities:
          type: array
          items:
            type: string
          description: Derived capability set
        securityLevel:
          type: integer
          description: Security clearance level
        mappingStatus:
          type: string
          enum: [active, disabled]
          description: User mapping status
