# RAGFlow upstream patch registry
# Every upstream source modification must be registered here with ADR, tests, and upgrade notes.
# Format per docs/03-版本冻结源码管理与升级.md.

baseline:
  enterprise_commit: d12f0a2
  upstream_tag: v0.26.4
  upstream_commit: cb93883f3f8c975eecb2fed81210effeb3bdb06f
  upstream_image: infiniflow/ragflow:v0.26.4
  note: P0 stabilization changes live under enterprise/ and do not modify upstream sources.

patches:
  - id: RF-PATCH-001
    reason: "entrypoint.sh mount disabled for local compatibility"
    upstream_files: [ragflow/docker/docker-compose.yml]
    adr: "decisions/ADR-002"
    introduced_in: "WP-00"
    tests: ["docker compose up -d", "curl /api/v1/system/ping"]
  - id: RF-PATCH-003
    reason: "skip empty_response early return when the last chat message has files"
    upstream_files:
      - ragflow/api/db/services/dialog_service.py
    adr: "decisions/ADR-008-empty-response-skip-on-files.md"
    change_request: "patches/CHANGE-REQUEST-EMPTY-RESPONSE-SKIP-ON-FILES.md"
    introduced_in: "inquiry-attachment-hybrid"
    tests:
      - "enterprise/tests/test_v2_message_attachments.py"
    upgrade_notes: "Replay the files-guard on async_chat empty_response; rollback restores the original if."
  - id: RF-PATCH-004
    reason: "grounding_version=1 keeps prompt markers and log redaction; fuse/buffering gated by _IDENTIFIER_NUMERIC_FUSE_ENABLED; rag_agent path follows reasoning 1-4; think_log redacts question/knowledge on grounding requests"
    upstream_files:
      - ragflow/rag/grounding/__init__.py
      - ragflow/rag/grounding/guard.py
      - ragflow/api/db/services/dialog_service.py
      - ragflow/api/db/services/llm_service.py
      - ragflow/api/db/services/tenant_llm_service.py
      - ragflow/rag/llm/chat_model.py
      - ragflow/rag/prompts/generator.py
      - ragflow/rag/advanced_rag/think_log.py
      - ragflow/conf/service_conf.yaml
      - ragflow/docker/service_conf.yaml.template
    adr: "decisions/ADR-010-EAM-v2-拆除-Grounding-Mega-Switch.md"
    change_request: "patches/CHANGE-REQUEST-EAM-V2-GROUNDING-CONTEXT.md"
    introduced_in: "eam-v2-grounding-guard"
    tests:
      - "ragflow/test/unit_test/rag/grounding/test_guard.py"
      - "ragflow/test/unit_test/api/db/services/test_dialog_service_grounding.py"
      - "ragflow/test/unit_test/rag/advanced_rag/test_think_log.py"
      - "enterprise/tests/test_v2_grounding_integration.py"
      - "enterprise/tests/test_v2_conversation_contract.py"
      - "enterprise/tests/test_ragflow_client.py"
      - "enterprise/scripts/run_file_share_v3_v2_e2e.py"
    upgrade_notes: "Replay grounding_version=1 prompt markers, no-content tracing, fuse switch, and minio.bucket=ragflow. Do not restore the rag_agent grounding short-circuit or always-on token buffer. Copy drifted KB-id MinIO objects into ragflow/<dataset_id>/ before deleting source buckets."
  - id: RF-PATCH-005
    reason: "simple chat WebSearch provider failures fall back to already-retrieved internal knowledge without logging query data"
    upstream_files:
      - ragflow/api/db/services/dialog_service.py
      - ragflow/rag/advanced_rag/agentic_rag.py
      - ragflow/rag/advanced_rag/harness/tools/exploration.py
      - ragflow/rag/advanced_rag/harness/tools/search.py
      - ragflow/rag/advanced_rag/harness/tools/navigation.py
      - ragflow/rag/advanced_rag/harness/tools/registry.py
    adr: "decisions/ADR-012-WebSearch故障回退内部知识.md"
    introduced_in: "RF26-WP05"
    tests:
      - "ragflow/test/unit_test/api/db/services/test_dialog_service_grounding.py::test_simple_web_search_failure_keeps_internal_knowledge"
      - "enterprise/tests/test_v2_grounding_integration.py::test_advanced_rag_query_logs_are_metadata_only"
    upgrade_notes: "Keep the try/except limited to provider create/retrieve/merge; do not hide internal KB retrieval failures or switch providers."
  - id: RF-PATCH-006
    reason: "authenticated single-object cleanup for temporary /documents/upload attachments"
    upstream_files:
      - ragflow/api/apps/restful_apis/document_api.py
    adr: "decisions/ADR-013-会话临时附件认证删除.md"
    introduced_in: "RF26-WP06"
    tests:
      - "ragflow/test/testcases/test_web_api/test_document_app/test_upload_info_unit.py"
      - "enterprise/tests/test_ragflow_chat_attachment_client.py"
    upgrade_notes: "Delete only a 32-hex upload id from the authenticated tenant downloads bucket; never accept bucket or owner from the request."
  - id: RF-PATCH-007
    reason: "chat completion final payloads carry an explicit business terminal status (completed / no_reliable_evidence / failed) so the Gateway maps instead of guessing from answer text"
    upstream_files:
      - ragflow/api/db/services/dialog_service.py
      - ragflow/api/apps/restful_apis/chat_api.py
    adr: "decisions/ADR-015-completion-explicit-terminal-status.md"
    change_request: "patches/CHANGE-REQUEST-RF-PATCH-007-COMPLETION-STATUS.md"
    introduced_in: "RF-PATCH-007-completion-status"
    tests:
      - "ragflow/test/unit_test/api/db/services/test_dialog_service_grounding.py"
      - "ragflow/test/testcases/test_http_api/test_session_management/test_session_sdk_routes_unit.py::test_session_completion_stream_error_frame_carries_failed_status"
    upgrade_notes: "Replay _completion_status plus the status keys on async_chat_solo/async_chat/rag_agent final payloads, _grounding_abstain_event, and the chat_api code:500 SSE error frame; keep the stream-final status computed before the non-grounding answer blanking. Rollback removes only the status keys and must be paired with disabling the Gateway's status read."
  - id: RF-PATCH-008
    reason: "grounding-safe prompt summary and deduplicated agentic stage trace remain visible in RAGFlow live and persisted sessions"
    upstream_files:
      - ragflow/rag/advanced_rag/think_log.py
      - ragflow/api/db/services/dialog_service.py
      - ragflow/api/db/services/conversation_service.py
    adr: "decisions/ADR-016-RAGFlow安全过程可观察性.md"
    change_request: "patches/CHANGE-REQUEST-RF-PATCH-008-SECURE-OBSERVABILITY.md"
    introduced_in: "RF-PATCH-008-secure-observability"
    tests:
      - "ragflow/test/unit_test/rag/advanced_rag/test_think_log.py"
      - "ragflow/test/unit_test/api/db/services/test_secure_observability.py"
      - "enterprise/tests/test_v2_grounding_integration.py"
    upgrade_notes: "Replay the grounding prompt summary, static think-log descriptions, final agentic stage aggregation, and conversation prompt persistence. Do not restore raw Prompt, query, evidence, tool arguments, or tool results."
  - id: RF-PATCH-009
    reason: "request-scoped bounded RAG diagnostics correlated by the Gateway runId without recording prompts, chunk bodies, or raw model output"
    upstream_files:
      - ragflow/rag/diagnostics.py
      - ragflow/api/apps/restful_apis/chat_api.py
      - ragflow/rag/nlp/search.py
      - ragflow/api/db/services/dialog_service.py
      - ragflow/rag/advanced_rag/agentic_rag_graph.py
      - ragflow/api/db/services/llm_service.py
    adr: "decisions/ADR-017-RAG诊断旁路.md"
    change_request: "patches/CHANGE-REQUEST-RF-PATCH-009-RAG-DIAGNOSTICS.md"
    introduced_in: "RF-PATCH-009-rag-diagnostics"
    tests:
      - "ragflow/test/unit_test/rag/test_diagnostics.py"
      - "enterprise/tests/test_ragflow_client.py"
      - "enterprise/tests/test_v2_conversation_contract.py"
      - "enterprise/tests/test_system_admin.py"
      - "enterprise/scripts/run_rag_diagnostics_e2e.py"
    upgrade_notes: "Replay the request ContextVar sink, chat entry attachment, retrieval/context/LLM metadata calls, and their isolated tests. Keep diagnostics disabled by default and never restore Prompt, chunk body, tool payload, or raw response capture."

  - id: RF-PATCH-010
    reason: "document run terminal webhook to Gateway (DONE/FAIL/CANCEL) without EAM coupling"
    upstream_files:
      - ragflow/api/utils/enterprise_status_webhook.py
      - ragflow/api/db/services/document_service.py
      - ragflow/api/db/services/task_service.py
    adr: "docs/superpowers/plans/2026-09-04-ragflow-status-webhook.md"
    change_request: "patches/CHANGE-REQUEST-RF-PATCH-010-DOCUMENT-RUN-TERMINAL-WEBHOOK.md"
    introduced_in: "RF-PATCH-010-document-run-terminal-webhook"
    tests:
      - "enterprise/tests/test_ragflow_status_webhook.py"
    upgrade_notes: "Replay enterprise_status_webhook helpers plus emit-on-run-change hooks in DocumentService._sync_progress/update_by_id and TaskService.update_progress FAIL. Keep StatusReconciler; do not productize RF outbound outbox. Rollback removes hooks and disables ENTERPRISE_STATUS_WEBHOOK_ENABLED / ENTERPRISE_RAGFLOW_STATUS_WEBHOOK_ENABLED."

  - id: RF-PATCH-011
    reason: "opt-in Gateway-authorized document scope for metadata filtering, with rewrite-before-filter ordering and fail-closed empty scope semantics"
    upstream_files:
      - ragflow/common/metadata_utils.py
      - ragflow/common/metadata_es_filter.py
      - ragflow/api/db/services/doc_metadata_service.py
      - ragflow/api/db/services/dialog_service.py
      - ragflow/api/utils/scope_identity_prompt.py
      - ragflow/rag/prompts/generator.py
      - ragflow/rag/advanced_rag/agentic_rag.py
      - ragflow/rag/advanced_rag/agentic_rag_graph.py
      - ragflow/rag/advanced_rag/harness/pipeline.py
      - ragflow/rag/advanced_rag/harness/tools/search.py
      - ragflow/rag/advanced_rag/harness/tools/navigation.py
    adr: "decisions/ADR-018-Gateway-A授权与Metadata-Restrict.md"
    change_request: "patches/CHANGE-REQUEST-RF-PATCH-011-RESTRICTED-METADATA-SCOPE.md"
    introduced_in: "RF-PATCH-011-restricted-metadata-scope"
    tests:
      - "ragflow/test/unit_test/common/test_restricted_metadata_scope.py"
      - "ragflow/test/unit_test/api/utils/test_scope_identity_prompt.py"
      - "ragflow/test/unit_test/rag/advanced_rag/test_gating_and_doc_scope.py"
      - "enterprise/tests/test_ragflow_client.py"
      - "enterprise/tests/test_v2_conversation_contract.py"
    upgrade_notes: "Build a new RAGFlow image. Keep the official metadata helper's default extend behavior; only Gateway requests carrying doc_scope_mode=restrict use the bounded G intersection. Upgrade Gateway schema to v7, keep ENTERPRISE_RETRIEVAL_SCOPE_POLICY=legacy_device by default, and verify empty-set and cross-tenant negatives before enabling authorized_context. Rollback uses the previous image and legacy_device; do not treat this change as a server-30 deployment."
  - id: RF-PATCH-012
    reason: "Agent Workflow Retrieval accepts a Gateway-injected restricted document scope, and the ingestion Parser exposes the existing JsonParser for JSON/JSONL pipeline inputs"
    upstream_files:
      - ragflow/agent/tools/retrieval.py
      - ragflow/rag/flow/parser/parser.py
    adr: "decisions/ADR-021-Agent-Workflow受控范围与多格式Pipeline.md"
    change_request: "patches/CHANGE-REQUEST-RF-PATCH-012-WORKFLOW-SCOPE-JSON-PIPELINE.md"
    introduced_in: "agent-workflow-v1"
    tests:
      - "enterprise/tests/test_workflow_artifacts.py"
      - "ragflow/test/unit_test/agent/tools/test_retrieval_scope.py"
      - "ragflow/test/unit_test/rag/flow/test_parser_json_setup.py"
    upgrade_notes: "Replay only the Retrieval doc_scope_ids/doc_scope_mode handling and Parser json/jsonl setup/function map. Restricted scope must return empty on missing or empty Gateway input; JSON parsing must reuse JsonParser and preserve record boundaries. Do not change ordinary Retrieval or Parser defaults. Build a new RAGFlow image before enabling the Workflow route."
