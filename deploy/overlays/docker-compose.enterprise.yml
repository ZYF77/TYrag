# Enterprise overlay -- adds health-check service.
# Run AFTER RAGFlow is already up:
#   docker compose -f ragflow/docker/docker-compose.yml -f deploy/overlays/docker-compose.enterprise.yml --profile enterprise run --rm enterprise-health

services:
  enterprise-health:
    image: python:3.13-slim
    profiles:
      - enterprise
    working_dir: /app
    command:
      - python
      - -c
      - |
        import time, urllib.request, json, sys
        print("Enterprise health probe waiting for RAGFlow...", flush=True)
        for i in range(30):
            try:
                resp = urllib.request.urlopen("http://ragflow-cpu:9380/api/v1/system/ping", timeout=5)
                if resp.read().decode().strip() == "pong":
                    print(json.dumps({"status": "ready", "ragflow": "live", "attempt": i+1}))
                    sys.exit(0)
            except Exception as e:
                pass
            time.sleep(2)
        print(json.dumps({"status": "not_ready", "ragflow": "unreachable"}))
        sys.exit(1)
    networks:
      - ragflow
    restart: "no"
