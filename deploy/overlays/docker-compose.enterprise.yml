# Required local Integration overlay.
#
# Start with the upstream CPU compose file first so all relative paths resolve
# from ragflow/docker:
#   docker compose -f ragflow/docker/docker-compose.yml \
#     -f deploy/overlays/docker-compose.enterprise.yml \
#     --profile cpu up -d
# Host tests connect to the dedicated PostgreSQL service through port 55432.

services:
  gateway-postgres:
    image: ${ENTERPRISE_GATEWAY_POSTGRES_IMAGE:-postgres:17.11-alpine3.24}
    environment:
      POSTGRES_DB: ${ENTERPRISE_GATEWAY_DB_NAME:-tyrag_gateway}
      POSTGRES_USER: ${ENTERPRISE_GATEWAY_DB_USER:-tyrag_gateway}
      POSTGRES_PASSWORD: ${ENTERPRISE_GATEWAY_DB_PASSWORD:?set ENTERPRISE_GATEWAY_DB_PASSWORD}
    ports:
      - "127.0.0.1:${ENTERPRISE_GATEWAY_POSTGRES_PORT:-55432}:5432"
    volumes:
      - gateway_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - ragflow
    restart: unless-stopped

  enterprise-gateway:
    image: ${ENTERPRISE_GATEWAY_IMAGE:-tyrag/enterprise-gateway:v0.26.4}
    entrypoint: []
    working_dir: /ragflow
    command:
      - /ragflow/.venv/bin/python
      - -m
      - uvicorn
      - enterprise.gateway.app:app
      - --host
      - 0.0.0.0
      - --port
      - "5188"
    ports:
      - ${ENTERPRISE_GATEWAY_PORT:-5188}:5188
    volumes:
      - ../../enterprise:/ragflow/enterprise:ro
      - ../../contracts:/ragflow/contracts:ro
      - ${ENTERPRISE_FILE_SHARE_HOST_ROOT:?set ENTERPRISE_FILE_SHARE_HOST_ROOT}:/var/lib/tyrag/file-share:ro
      - ${ENTERPRISE_GATEWAY_STATE_HOST_DIR:?set ENTERPRISE_GATEWAY_STATE_HOST_DIR}:/var/lib/tyrag/state
    environment:
      PYTHONPATH: /ragflow
      RAGFLOW_BASE_URL: http://ragflow-cpu:9380
      RAGFLOW_TIMEOUT: "120"
      # Read-only mirrors of the RAGFlow executor tuning shown in Gateway Web.
      RAGFLOW_MAX_CONCURRENT_TASKS: ${MAX_CONCURRENT_TASKS:-5}
      RAGFLOW_MAX_CONCURRENT_CHUNK_BUILDERS: ${MAX_CONCURRENT_CHUNK_BUILDERS:-1}
      RAGFLOW_EXECUTOR_WORKERS: ${WORKERS:-1}
      RAGFLOW_API_KEY: ${RAGFLOW_API_KEY:?set RAGFLOW_API_KEY}
      ENTERPRISE_RAGFLOW_BASE_URL: http://ragflow-cpu:9380
      ENTERPRISE_RAGFLOW_API_KEY: ${RAGFLOW_API_KEY:?set RAGFLOW_API_KEY}
      ENTERPRISE_RAGFLOW_DATASET_NAME: ${ENTERPRISE_RAGFLOW_DATASET_NAME:-}
      ENTERPRISE_RAGFLOW_DATASET_PERMISSION: ${ENTERPRISE_RAGFLOW_DATASET_PERMISSION:-}
      ENTERPRISE_QUERY_SOURCE_SYSTEM: ${ENTERPRISE_QUERY_SOURCE_SYSTEM:-EAM}
      ENTERPRISE_RAG_DIAGNOSTICS_ENABLED: ${ENTERPRISE_RAG_DIAGNOSTICS_ENABLED:-false}
      ENTERPRISE_FILE_SHARE_ROOTS: '{"device-share":"/var/lib/tyrag/file-share"}'
      ENTERPRISE_FILE_SHARE_MAX_SIZE_MB: ${ENTERPRISE_FILE_SHARE_MAX_SIZE_MB:-128}
      S3_MAX_SIZE_MB: ${S3_MAX_SIZE_MB:-128}
      ENTERPRISE_GATEWAY_STATE_HOST_DIR: /var/lib/tyrag/state
      ENTERPRISE_GATEWAY_DB_HOST: gateway-postgres
      ENTERPRISE_GATEWAY_DB_PORT: "5432"
      ENTERPRISE_GATEWAY_DB_NAME: ${ENTERPRISE_GATEWAY_DB_NAME:-tyrag_gateway}
      ENTERPRISE_GATEWAY_DB_USER: ${ENTERPRISE_GATEWAY_DB_USER:-tyrag_gateway}
      ENTERPRISE_GATEWAY_DB_PASSWORD: ${ENTERPRISE_GATEWAY_DB_PASSWORD:?set ENTERPRISE_GATEWAY_DB_PASSWORD}
      ENTERPRISE_REDIS_URL: ${ENTERPRISE_REDIS_CONTAINER_URL:-redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/0}
      ENTERPRISE_EAM_ASSET_RESOLVER_MODE: ${ENTERPRISE_EAM_ASSET_RESOLVER_MODE:-}
      ENTERPRISE_EAM_ASSET_RESOLVER_BASE_URL: ${ENTERPRISE_EAM_ASSET_RESOLVER_CONTAINER_BASE_URL:-${ENTERPRISE_EAM_ASSET_RESOLVER_BASE_URL:-}}
      ENTERPRISE_EAM_ASSET_RESOLVER_PATH: ${ENTERPRISE_EAM_ASSET_RESOLVER_PATH:-/api/integration/v1/assets/resolve}
      ENTERPRISE_EAM_ASSET_RESOLVER_TOKEN: ${ENTERPRISE_EAM_ASSET_RESOLVER_TOKEN:-}
      ENTERPRISE_SYNC_AUTH_ENABLED: "true"
      ENTERPRISE_SYNC_HMAC_CREDENTIALS: ${ENTERPRISE_SYNC_HMAC_CREDENTIALS:?set ENTERPRISE_SYNC_HMAC_CREDENTIALS}
      JWT_ISSUER: ${JWT_ISSUER:?set JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE:?set JWT_AUDIENCE}
      JWT_ENABLE_HS: ${JWT_ENABLE_HS:-true}
      JWT_ALLOWED_ALGS: ${JWT_ALLOWED_ALGS:-HS256}
      JWT_SHARED_SECRET: ${JWT_SHARED_SECRET:?set JWT_SHARED_SECRET}
      # Local single-account WebUI session; inject only a password hash.
      ENTERPRISE_CONSOLE_AUTH_ENABLED: ${ENTERPRISE_CONSOLE_AUTH_ENABLED:-true}
      ENTERPRISE_CONSOLE_PASSWORD_HASH: ${ENTERPRISE_CONSOLE_PASSWORD_HASH:-}
      ENTERPRISE_CONSOLE_SESSION_SECRET: ${ENTERPRISE_CONSOLE_SESSION_SECRET:-}
      ENTERPRISE_CONSOLE_TENANT_ID: ${ENTERPRISE_CONSOLE_TENANT_ID:-}
      ENTERPRISE_CONSOLE_SESSION_TTL_SECONDS: ${ENTERPRISE_CONSOLE_SESSION_TTL_SECONDS:-28800}
      ENTERPRISE_CONSOLE_COOKIE_SECURE: ${ENTERPRISE_CONSOLE_COOKIE_SECURE:-false}
      ENTERPRISE_CONSOLE_ALLOWED_ORIGINS: ${ENTERPRISE_CONSOLE_ALLOWED_ORIGINS:-}
      ENTERPRISE_CALLBACK_ENABLED: ${ENTERPRISE_CALLBACK_ENABLED:-false}
      ENTERPRISE_CALLBACK_HMAC_SECRET: ${ENTERPRISE_CALLBACK_HMAC_SECRET:-}
      ENTERPRISE_CALLBACK_ENDPOINTS: ${ENTERPRISE_CALLBACK_ENDPOINTS:-}
      ENTERPRISE_CALLBACK_MAX_ATTEMPTS: ${ENTERPRISE_CALLBACK_MAX_ATTEMPTS:-8}
      ENTERPRISE_CALLBACK_POLL_SECONDS: ${ENTERPRISE_CALLBACK_POLL_SECONDS:-2.0}
    depends_on:
      gateway-postgres:
        condition: service_healthy
      ragflow-cpu:
        condition: service_started
    networks:
      - ragflow
    restart: unless-stopped

  enterprise-health:
    image: python:3.13-slim
    profiles:
      - enterprise
    working_dir: /app
    command:
      - python
      - -c
      - |
        import time, urllib.request, json, sys
        print("Enterprise health probe waiting for Gateway and RAGFlow...", flush=True)
        for i in range(30):
            try:
                gateway = urllib.request.urlopen("http://enterprise-gateway:5188/enterprise/api/v1/health", timeout=5)
                ragflow = urllib.request.urlopen("http://ragflow-cpu:9380/api/v1/system/ping", timeout=5)
                if gateway.status == 200 and ragflow.read().decode().strip() == "pong":
                    print(json.dumps({"status": "ready", "gateway": "live", "ragflow": "live", "attempt": i + 1}))
                    sys.exit(0)
            except Exception:
                pass
            time.sleep(2)
        print(json.dumps({"status": "not_ready", "gateway": "unreachable", "ragflow": "unreachable"}))
        sys.exit(1)
    networks:
      - ragflow
    restart: "no"

volumes:
  gateway_postgres_data:
