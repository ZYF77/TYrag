name: ${COMPOSE_PROJECT_NAME:-tyrag-production}

x-env-file: &production-env-file
  - path: ${TYRAG_ENV_FILE:-.env}
    required: false

services:
  es01:
    image: ${ELASTICSEARCH_IMAGE:-elasticsearch:8.11.3}
    env_file: *production-env-file
    environment:
      node.name: es01
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?set ELASTIC_PASSWORD}
      bootstrap.memory_lock: "false"
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      cluster.routing.allocation.disk.watermark.low: ${ES_DISK_WATERMARK_LOW:-5gb}
      cluster.routing.allocation.disk.watermark.high: ${ES_DISK_WATERMARK_HIGH:-3gb}
      cluster.routing.allocation.disk.watermark.flood_stage: ${ES_DISK_WATERMARK_FLOOD_STAGE:-2gb}
    volumes:
      - es_data:/usr/share/elasticsearch/data
    tmpfs:
      - /tmp:mode=1777,size=512m
    mem_limit: ${ES_MEM_LIMIT:-4g}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD-SHELL", "curl http://localhost:9200"]
      interval: 10s
      timeout: 10s
      retries: 60
    networks:
      - tyrag
    restart: unless-stopped

  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.0.40}
    env_file: *production-env-file
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
    command:
      - --max_connections=1000
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --tls_version=TLSv1.2,TLSv1.3
      - --init-file=/data/application/init.sql
      - --binlog_expire_logs_seconds=604800
    volumes:
      - mysql_data:/var/lib/mysql
      - ./files/init.sql:/data/application/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 10s
      retries: 60
    networks:
      - tyrag
    restart: unless-stopped

  minio:
    image: ${MINIO_IMAGE:-pgsty/minio:RELEASE.2026-03-25T00-00-00Z}
    env_file: *production-env-file
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:?set MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?set MINIO_PASSWORD}
    command: ["server", "--console-address", ":9001", "/data"]
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 10s
      retries: 60
    networks:
      - tyrag
    restart: unless-stopped

  redis:
    image: ${REDIS_IMAGE:-valkey/valkey:8}
    env_file: *production-env-file
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      - --maxmemory
      - ${REDIS_MAXMEMORY:-128mb}
      - --maxmemory-policy
      - ${REDIS_MAXMEMORY_POLICY:-volatile-lru}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping"]
      interval: 10s
      timeout: 10s
      retries: 60
    networks:
      - tyrag
    restart: unless-stopped

  ragflow-cpu:
    image: ${RAGFLOW_IMAGE:?set RAGFLOW_IMAGE}
    env_file: *production-env-file
    command:
      - --enable-adminserver
      - --init-model-provider-tables
    ports:
      - "${RAGFLOW_BIND_ADDRESS:-127.0.0.1}:${RAGFLOW_WEB_PORT:-8080}:80"
      - "${RAGFLOW_BIND_ADDRESS:-127.0.0.1}:${RAGFLOW_HTTPS_PORT:-8443}:443"
      - "${RAGFLOW_BIND_ADDRESS:-127.0.0.1}:${RAGFLOW_API_PORT:-9380}:9380"
      - "${RAGFLOW_BIND_ADDRESS:-127.0.0.1}:${RAGFLOW_ADMIN_PORT:-9381}:9381"
      - "${RAGFLOW_BIND_ADDRESS:-127.0.0.1}:${RAGFLOW_MCP_PORT:-9382}:9382"
      - "${RAGFLOW_BIND_ADDRESS:-127.0.0.1}:${RAGFLOW_GO_PORT:-9384}:9384"
      - "${RAGFLOW_BIND_ADDRESS:-127.0.0.1}:${RAGFLOW_GO_ADMIN_PORT:-9383}:9383"
    environment:
      DOC_ENGINE: elasticsearch
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DBNAME: ${MYSQL_DBNAME:-rag_flow}
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
      MINIO_HOST: minio
      MINIO_USER: ${MINIO_USER:?set MINIO_USER}
      MINIO_PASSWORD: ${MINIO_PASSWORD:?set MINIO_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-ragflow}
      ES_HOST: es01
      ES_USER: ${ES_USER:-elastic}
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?set ELASTIC_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      TYRAG_EXTERNAL_SOURCE_GATEWAY_URL: http://enterprise-gateway:5188
      TYRAG_EXTERNAL_SOURCE_INTERNAL_KEY: ${TYRAG_EXTERNAL_SOURCE_INTERNAL_KEY:?set TYRAG_EXTERNAL_SOURCE_INTERNAL_KEY}
    volumes:
      - ragflow_logs:/ragflow/logs
    depends_on:
      mysql:
        condition: service_healthy
      es01:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9380/api/v1/system/ping | grep -qx pong"]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 30s
    networks:
      - tyrag
    restart: unless-stopped

  enterprise-gateway:
    image: ${ENTERPRISE_GATEWAY_IMAGE:?set ENTERPRISE_GATEWAY_IMAGE}
    env_file: *production-env-file
    entrypoint: []
    working_dir: /ragflow
    command:
      - /ragflow/.venv/bin/python
      - -m
      - uvicorn
      - enterprise.gateway.app:app
      - --host
      - 0.0.0.0
      - --port
      - "5188"
      - --workers
      - "1"
    ports:
      - "${ENTERPRISE_GATEWAY_BIND_ADDRESS:-127.0.0.1}:${ENTERPRISE_GATEWAY_PORT:-5188}:5188"
    volumes:
      - ${ENTERPRISE_FILE_SHARE_HOST_ROOT:?set ENTERPRISE_FILE_SHARE_HOST_ROOT}:/var/lib/tyrag/file-share:ro
      - ${ENTERPRISE_GATEWAY_STATE_HOST_DIR:?set ENTERPRISE_GATEWAY_STATE_HOST_DIR}:/var/lib/tyrag/state
    environment:
      PYTHONPATH: /ragflow
      ENTERPRISE_TEST_MODE: "0"
      RAGFLOW_BASE_URL: http://ragflow-cpu:9380
      RAGFLOW_API_VERSION: v1
      RAGFLOW_API_KEY: ${RAGFLOW_API_KEY:?set RAGFLOW_API_KEY}
      ENTERPRISE_RAGFLOW_BASE_URL: http://ragflow-cpu:9380
      ENTERPRISE_RAGFLOW_API_KEY: ${RAGFLOW_API_KEY:?set RAGFLOW_API_KEY}
      ENTERPRISE_RAGFLOW_DATASET_NAME: ${ENTERPRISE_RAGFLOW_DATASET_NAME:-}
      ENTERPRISE_RAGFLOW_DATASET_PERMISSION: ${ENTERPRISE_RAGFLOW_DATASET_PERMISSION:-}
      ENTERPRISE_QUERY_SOURCE_SYSTEM: ${ENTERPRISE_QUERY_SOURCE_SYSTEM:-EAM}
      ENTERPRISE_FILE_SHARE_ROOTS: '{"device-share":"/var/lib/tyrag/file-share"}'
      ENTERPRISE_FILE_SHARE_MAX_SIZE_MB: ${ENTERPRISE_FILE_SHARE_MAX_SIZE_MB:-512}
      ENTERPRISE_SOURCE_TICKET_TTL_SECONDS: ${ENTERPRISE_SOURCE_TICKET_TTL_SECONDS:-300}
      ENTERPRISE_GATEWAY_STATE_HOST_DIR: /var/lib/tyrag/state
      ENTERPRISE_SYNC_DB_PATH: /var/lib/tyrag/state/gateway.db
      ENTERPRISE_DB_PATH: /var/lib/tyrag/state/gateway.db
      ENTERPRISE_REDIS_URL: ${ENTERPRISE_REDIS_CONTAINER_URL:?set ENTERPRISE_REDIS_CONTAINER_URL}
      ENTERPRISE_SERVICE_REPLAY_STORE: redis
      ENTERPRISE_REPLAY_KEY_PREFIX: ${ENTERPRISE_REPLAY_KEY_PREFIX:-tyrag:production:service-replay:}
      ENTERPRISE_EAM_ASSET_RESOLVER_MODE: ${ENTERPRISE_EAM_ASSET_RESOLVER_MODE:-}
      ENTERPRISE_EAM_ASSET_RESOLVER_BASE_URL: ${ENTERPRISE_EAM_ASSET_RESOLVER_BASE_URL:-}
      ENTERPRISE_EAM_ASSET_RESOLVER_PATH: ${ENTERPRISE_EAM_ASSET_RESOLVER_PATH:-/api/integration/v1/assets/resolve}
      ENTERPRISE_EAM_ASSET_RESOLVER_TOKEN: ${ENTERPRISE_EAM_ASSET_RESOLVER_TOKEN:-}
      ENTERPRISE_SYNC_AUTH_ENABLED: "true"
      ENTERPRISE_SYNC_HMAC_CREDENTIALS: ${ENTERPRISE_SYNC_HMAC_CREDENTIALS:?set ENTERPRISE_SYNC_HMAC_CREDENTIALS}
      JWT_ISSUER: ${JWT_ISSUER:?set JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE:?set JWT_AUDIENCE}
      JWT_JWKS_URL: ${JWT_JWKS_URL:?set JWT_JWKS_URL}
      JWT_ENABLE_HS: ${JWT_ENABLE_HS:-false}
      JWT_ALLOWED_ALGS: ${JWT_ALLOWED_ALGS:-RS256,ES256}
      JWT_LEEWAY_SECONDS: ${JWT_LEEWAY_SECONDS:-120}
      JWT_SHARED_SECRET: ${JWT_SHARED_SECRET:-}
      TYRAG_EXTERNAL_SOURCE_INTERNAL_KEY: ${TYRAG_EXTERNAL_SOURCE_INTERNAL_KEY:?set TYRAG_EXTERNAL_SOURCE_INTERNAL_KEY}
      AUTH_ENABLED: "true"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENTERPRISE_WORKER_ENABLED: ${ENTERPRISE_WORKER_ENABLED:-true}
      ENTERPRISE_QUALITY_WORKER_ENABLED: ${ENTERPRISE_QUALITY_WORKER_ENABLED:-true}
      ENTERPRISE_QUALITY_STRICT_MODE: ${ENTERPRISE_QUALITY_STRICT_MODE:-true}
      ENTERPRISE_CALLBACK_ENABLED: ${ENTERPRISE_CALLBACK_ENABLED:-false}
      ENTERPRISE_CALLBACK_HMAC_SECRET: ${ENTERPRISE_CALLBACK_HMAC_SECRET:-}
      ENTERPRISE_CALLBACK_ENDPOINTS: ${ENTERPRISE_CALLBACK_ENDPOINTS:-}
      ENTERPRISE_CALLBACK_MAX_ATTEMPTS: ${ENTERPRISE_CALLBACK_MAX_ATTEMPTS:-8}
      ENTERPRISE_CALLBACK_POLL_SECONDS: ${ENTERPRISE_CALLBACK_POLL_SECONDS:-2.0}
      ENTERPRISE_AUDIT_LOG_DIR: ${ENTERPRISE_AUDIT_LOG_DIR:-/var/lib/tyrag/state/logs}
    depends_on:
      ragflow-cpu:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/ragflow/.venv/bin/python", "-m", "enterprise.gateway.health"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    networks:
      - tyrag
    restart: unless-stopped

  enterprise-web:
    image: ${ENTERPRISE_WEB_IMAGE:?set ENTERPRISE_WEB_IMAGE}
    profiles:
      - diagnostics
    ports:
      - "${ENTERPRISE_WEB_BIND_ADDRESS:-127.0.0.1}:${ENTERPRISE_WEB_PORT:-3000}:8080"
    depends_on:
      enterprise-gateway:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,size=16m
      - /var/run:rw,noexec,nosuid,size=1m
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    networks:
      - tyrag
    restart: unless-stopped

volumes:
  es_data:
  mysql_data:
  minio_data:
  redis_data:
  ragflow_logs:

networks:
  tyrag:
    driver: bridge
